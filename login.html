<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Ben-Learning | Connexion</title>
  <meta name="theme-color" content="#2563eb">
  <link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth-page">
<header class="site-header" id="siteHeader"><a class="brand" href="index.html"><span>🎓</span> Ben-Learning</a><button class="menu-btn" id="menuBtn" type="button" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="mainNav"><span aria-hidden="true">☰</span></button><nav id="mainNav"><a href="index.html">Accueil</a><a href="register.html">Inscription</a></nav></header>
<main class="auth-wrap"><section class="auth-card"><span class="eyebrow">Bon retour</span><h1>Connexion étudiant</h1><p>Connecte-toi pour consulter ton statut d’inscription et accéder à ton espace après validation.</p>
<form id="loginForm"><label>Email<input id="loginEmail" type="email" required placeholder="nom@email.com"></label><label>Mot de passe<input id="loginPassword" type="password" required minlength="6" placeholder="••••••••"></label><button class="btn primary wide" type="submit">Se connecter</button></form>
<p class="auth-switch">Pas encore inscrit ? <a href="register.html">Créer un compte</a></p><div id="authMessage" class="form-message"></div></section></main>
<script src="js/app.js"></script>
<script type="module" src="js/auth.js"></script>
</body>
</html>
