<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Ben-Learning | Admin</title>
  <meta name="theme-color" content="#2563eb">
  <link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth-page">
<header class="site-header" id="siteHeader"><a class="brand" href="index.html"><span>🎓</span> Ben-Learning</a><button class="menu-btn" id="menuBtn" type="button" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="mainNav"><span aria-hidden="true">☰</span></button><nav id="mainNav"><a href="index.html">Retour au site</a></nav></header>
<main class="auth-wrap"><section class="auth-card">
  <span class="eyebrow">Administration</span>
  <h1>Connexion Admin</h1>
  <p>Connecte-toi avec un compte Firebase dont le champ <strong>role</strong> est <strong>admin</strong> dans Firestore.</p>
  <form id="adminLoginForm">
    <label>Email<input id="adminEmail" type="email" required placeholder="admin@email.com"></label>
    <label>Mot de passe<input id="adminPassword" type="password" required minlength="6" placeholder="••••••••"></label>
    <button class="btn primary wide" type="submit">Connexion Admin</button>
  </form>
  <div id="adminMessage" class="form-message"></div>
</section></main>
<script src="js/app.js"></script>
<script type="module" src="js/admin-auth.js"></script>
</body></html>
