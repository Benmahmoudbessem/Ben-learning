<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ben-Learning | Cours</title>
  <link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<header class="site-header">
  <a class="brand" href="index.html"><span>🎓</span> Ben-Learning</a><button class="menu-btn" id="menuBtn">☰</button>
  <nav id="mainNav"><a href="index.html">Accueil</a><a class="active" href="courses.html">Cours</a><a href="quiz.html">Quiz</a><a href="profile.html">Mon espace</a><a id="authLink" class="nav-cta" href="login.html">Connexion</a></nav>
</header>
<main class="section page-top">
  <div class="section-heading left"><span class="eyebrow">Bibliothèque</span><h1>📚 Cours & ressources</h1><p>Recherche un cours par titre, niveau, section ou domaine.</p></div>
  <div class="filter-bar filter-bar-4">
    <input id="search" type="search" placeholder="Rechercher un cours…" aria-label="Rechercher">
    <select id="level"><option value="all">Tous les niveaux</option><option value="1ère">1ère</option><option value="2ème">2ème</option><option value="3ème">3ème</option><option value="Bac">Bac</option></select>
    <select id="section"><option value="all">Toutes les sections</option><option value="Informatique">Informatique</option><option value="Sciences">Sciences</option><option value="Économie">Économie</option><option value="Lettres">Lettres</option><option value="Technique">Technique</option><option value="Tronc commun">Tronc commun</option></select>
    <select id="domain"><option value="all">Tous les domaines</option></select>
  </div>
  <div id="courseCount" class="result-count"></div>
  <div id="courseContainer" class="course-grid"></div>
  <div id="emptyState" class="empty-state hidden"><div>🔎</div><h3>Aucun cours trouvé</h3><p>Essaie avec un autre mot-clé ou filtre.</p></div>
</main>
<footer class="site-footer"><p>© 2026 Ben-Learning</p><a href="index.html">Accueil</a></footer>
<script src="js/app.js"></script><script src="js/courses.js"></script>
</body>
</html>
